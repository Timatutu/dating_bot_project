[project]
name = "dating-payment-botyra"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg==0.29.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "pydantic-settings>=2.0.0",
    "aio-pika>=9.0.0",
    "aiohttp>=3.10.0",
    "web3>=7.0.0",
    "grpcio>=1.66.0",
    "grpcio-tools>=1.66.0",
    "protobuf>=5.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "workers"]
