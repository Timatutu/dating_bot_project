[project]
name = "dating-botyra"
version = "0.1.0"
description = "Dating Telegram bot"
requires-python = ">=3.12"

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    # Pydantic
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg==0.29.0",
    "alembic>=1.13.3",
    # Cache
    "redis[hiredis]>=5.1.1",
    # Broker
    "aio-pika>=9.4.3",
    # Bot
    "aiogram>=3.13.0",
    # gRPC
    "grpcio>=1.66.0",
    "protobuf>=5.0.0",
    # Background tasks
    "celery[redis]>=5.4.0",
    # Storage (MinIO / S3)
    "minio>=7.2.9",
    # Monitoring
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]>=3.3.3",
]

[project.optional-dependencies]
crypto = [
    "web3>=7.3.0",
    "eth-account>=0.13.0",
    "pytoniq-core>=0.1.36",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "bot", "common", "workers"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "grpcio-tools>=1.80.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
